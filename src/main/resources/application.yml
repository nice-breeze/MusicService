
spring:
  application:
    name: music-service
  logging:
    level:
      root: INFO
      org.springframework.web: INFO
  flyway:
    locations: classpath:/db/migration
    schemas: music
    url: jdbc:postgresql://localhost:5432/postgres
    user: flyway_user
    password: flyway
    baselineOnMigrate: true
    enabled: true
    create-schemas: true
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: my_app_user
    password: nicebreeze
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: true